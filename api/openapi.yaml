                keys:
                  - id: 7
                    prefix: "st_abc12"
                    enabled: true
                    created_at: "2026-07-21T00:00:00Z"
                count: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createTenantKey
      summary: Issue an API key for a tenant
      description: >-
        Administrative endpoint, available only when MULTI_TENANT is enabled
        and gated behind the admin credential.
      tags: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            Tenant ID, as returned by POST /admin/tenants. Must be a
            positive integer.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
              example:
                id: 7
                prefix: "st_abc12"
                key: "st_abc12_xylophone12345678"
                enabled: true
                created_at: "2026-07-21T00:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/keys/{key_id}:
    delete:
      operationId: revokeKey
      summary: Revoke an API key
      description: >-
        Administrative endpoint, available only when MULTI_TENANT is enabled
        and gated behind the admin credential.
      tags: [Admin]
      parameters:
        - name: key_id
          in: path
          required: true
          description: >-
            API key ID, as returned by POST /admin/tenants/{id}/keys. This
            is the key's database ID, not its public prefix and not the
            plaintext key.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 7
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /contracts:
    get:
      operationId: listContracts
      summary: List indexed contracts
      description: >-
        Contracts that have at least one stored event, with per-contract event
        counts and ledger ranges. Ordered by contract_id ascending; pass
        sort=count to rank by activity instead. Paginated with an opaque
        cursor that is omitted on the last page.
      tags: [Events]
      parameters:
        - $ref: "#/components/parameters/ContractsLimit"
        - $ref: "#/components/parameters/Cursor"
        - name: sort
          in: query
          description: >-
            Ordering key for the listing. The default walks contract IDs
            alphabetically, which is stable as new contracts are indexed;
            count ranks by activity instead.
          schema:
            type: string
            enum: [contract_id, count, first_ledger, last_ledger, last_seen]
            default: contract_id
        - $ref: "#/components/parameters/Order"
        - name: contract_id
          in: query
          description: >-
            Only list contracts whose ID starts with this prefix. A prefix,
            not a whole ID, so it is not validated as a strkey and a short
            string is a legitimate value.
          schema:
            type: string
            pattern: "^C[A-Z2-7]{0,55}$"
          example: "CDLZ"
      responses:
        "200":
          description: A page of indexed contracts
          headers:
            X-Total-Count:
              description: >-
                The total number of contracts matching the request's filters,
                ignoring pagination. Omitted when the count could not be
                computed; the page itself is still returned.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractsPage"
              example:
                contracts:
                  - contract_id: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
                    event_count: 42
                    first_ledger: 256000
                    last_ledger: 256050
                    last_seen: "2026-07-21T12:00:00Z"
                count: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /livez:
    get:
      operationId: livez
      summary: Liveness probe
      description: >-
        Reports only that the process is up. Never touches the database or RPC.
        It therefore has no failure response: a process that cannot answer 200
        here cannot answer at all.
      tags: [Operations]
      security: []
      responses:
        "200":
          description: The process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                checks: {}
  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe
      description: >-
        Reports whether the database, RPC and schema are usable, and whether
        ingestion has fallen more than 100 ledgers behind the chain head.
      tags: [Operations]
      security: []
      responses:
        "200":
          description: Every dependency is usable and ingestion is current
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                checks:
                  database: ok
                  rpc: ok
                  ingestion: current
        "503":
          description: >-
            A dependency is unusable or ingestion is lagging. The body names
            the failing check so the instance can be pulled from the load
            balancer without reading the logs. This is a degraded-readiness
            report rather than the shared error envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: degraded
                checks:
                  database: ok
                  rpc: unavailable
                  ingestion: lagging (150 ledgers behind)
  /version:
    get:
      operationId: version
      summary: Build version information
      description: >-
        Version, commit and build date embedded at build time.
      tags: [Operations]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  commit:
                    type: string
                  build_date:
                    type: string
              example:
                version: "0.1.0"
                commit: "dc0ff0d"
                build_date: "2026-07-21T00:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /metrics:
    get:
      operationId: metrics
      summary: Prometheus metrics
      description: >-
        Prometheus text-format exposition of ingest, RPC and HTTP metrics.
        Exempt from rate limiting, so a scrape can never be throttled by the
        pressure it is there to measure.
      tags: [Operations]
      responses:
        "200":
          description: The metrics exposition
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: >-
            No metrics collector is wired into this server. Plain text rather
            than the error envelope, because it is written by the route stub
            ahead of the collector's own handler.
          content:
            text/plain:
              schema:
                type: string
                examples: ["metrics not enabled"]
  /events/count:
    get:
      operationId: countEvents
      summary: Count matching events
      description: >-
        Total number of events matching the filter, ignoring pagination.
      tags: [Operations]
      parameters:
        - $ref: "#/components/parameters/ContractID"
        - $ref: "#/components/parameters/EventType"
        - $ref: "#/components/parameters/Topic"
        - $ref: "#/components/parameters/Topic0"
        - $ref: "#/components/parameters/Topic1"
        - $ref: "#/components/parameters/Topic2"
        - $ref: "#/components/parameters/Topic3"
        - $ref: "#/components/parameters/FromLedger"
        - $ref: "#/components/parameters/ToLedger"
        - $ref: "#/components/parameters/FromTime"
        - $ref: "#/components/parameters/ToTime"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    format: int64
              example:
                count: 42
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /events/aggregate:
    get:
      operationId: aggregateEvents
      summary: Aggregate event counts
      description: >-
        Event counts bucketed by ledger or by a time interval.
      tags: [Operations]
      parameters:
        - $ref: "#/components/parameters/ContractID"
        - $ref: "#/components/parameters/EventType"
        - $ref: "#/components/parameters/Topic"
        - $ref: "#/components/parameters/Topic0"
        - $ref: "#/components/parameters/Topic1"
        - $ref: "#/components/parameters/Topic2"
        - $ref: "#/components/parameters/Topic3"
        - $ref: "#/components/parameters/FromLedger"
        - $ref: "#/components/parameters/ToLedger"
        - $ref: "#/components/parameters/FromTime"
        - $ref: "#/components/parameters/ToTime"
        - name: bucket
          in: query
          required: true
          description: >-
            Grouping interval. Either the literal "ledger", which counts
            events per ledger, or a Go duration string, which counts them
            per interval of wall-clock time. Required: there is no default
            grouping to fall back on.
          schema:
            type: string
            pattern: "^(ledger|[0-9]+(ns|us|ms|s|m|h)([0-9]+(ns|us|ms|s|m|h))*)$"
          examples:
            perLedger:
              summary: One bucket per ledger
              value: ledger
            hourly:
              summary: One bucket per hour
              value: 1h
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  buckets:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        count:
                          type: integer
                          format: int64
              example:
                buckets:
                  - key: "256000"
                    count: 5
                  - key: "256001"
                    count: 3
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /events.csv:
    get:
      operationId: eventsCSV
      summary: Export events as CSV
      description: >-
        Streaming CSV export of matching events.
      tags: [Operations]
      parameters:
        - $ref: "#/components/parameters/ContractID"
        - $ref: "#/components/parameters/EventType"
        - $ref: "#/components/parameters/Topic"
        - $ref: "#/components/parameters/Topic0"
        - $ref: "#/components/parameters/Topic1"
        - $ref: "#/components/parameters/Topic2"
        - $ref: "#/components/parameters/Topic3"
        - $ref: "#/components/parameters/FromLedger"
        - $ref: "#/components/parameters/ToLedger"
        - $ref: "#/components/parameters/FromTime"
        - $ref: "#/components/parameters/ToTime"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/OrderBy"
      responses:
        "200":
          description: Success
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /events/{id}/raw:
    get:
      operationId: rawEvent
      summary: Get an event's raw XDR
      description: >-
        The base64 XDR the event was decoded from, for re-decoding.
      tags: [Operations]
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            TOID-based event identifier: the 16-digit ledger/transaction/
            operation offset, a hyphen, and a 10-digit index within the
            operation. Take it from an event in a listing rather than
            composing it.
          schema:
            type: string
            pattern: "^[0-9]{16}-[0-9]{10}$"
          example: "0001099511627776-0000000001"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  topics_xdr:
                    type: array
                    items:
                      type: string
                  value_xdr:
                    type: string
              example:
                topics_xdr:
                  - "AAAAA"
                  - "BBBBB"
                value_xdr: "CCCCC"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /events/{id}/transaction:
    get:
      operationId: eventTransaction
      summary: Get an event's sibling events
      description: >-
        Other events emitted by the same transaction.
      tags: [Operations]
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            TOID-based event identifier: the 16-digit ledger/transaction/
            operation offset, a hyphen, and a 10-digit index within the
            operation. Take it from an event in a listing rather than
            composing it.
          schema:
            type: string
            pattern: "^[0-9]{16}-[0-9]{10}$"
          example: "0001099511627776-0000000001"
        - $ref: "#/components/parameters/Decoded"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
              example:
                - id: "0001099511627776-0000000002"
                  contract_id: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
                  ledger: 256000
                  type: contract
                  tx_hash: "9f5c7a2b..."
                  tx_index: 0
                  op_index: 1
                  in_successful_call: true
                  topics:
                    - {"symbol":"transfer"}
                  value: {"address":"GDW6AUTBXTOC7FIKUO5BOO3OGLK4SF7ZPOBLMQHMZDI45J2Z6VXRB5NR"}
                  created_at: "2026-07-21T12:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /contracts/{id}:
    get:
      operationId: getContract
      summary: Get a single contract's summary
      description: >-
        Aggregate row for one indexed contract: how many events it has, the
        ledger range they span, and when it was last seen. Returns 404 for a
        contract with no indexed events.
      tags: [Operations]
      parameters:
        - name: id
          in: path
          required: true
          description: The contract to describe.
          schema:
            type: string
            pattern: "^C[A-Z2-7]{55}$"
          example: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
      responses:
        "200":
          description: Contract summary
          content:
            application/json:
              schema:
                type: object
                required: [contract_id, event_count, first_ledger, last_ledger, last_seen]
                properties:
                  contract_id:
                    type: string
                    description: Stellar contract ID (C-prefixed)
                  event_count:
                    type: integer
                    format: int64
                    description: Number of stored events for this contract
                  first_ledger:
                    type: integer
                    format: int64
                    description: Earliest ledger holding an event for this contract
                  last_ledger:
                    type: integer
                    format: int64
                    description: Most recent ledger holding an event for this contract
                  last_seen:
                    type: string
                    format: date-time
                    description: Timestamp of the most recent event
              example:
                contract_id: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
                event_count: 42
                first_ledger: 256000
                last_ledger: 256050
                last_seen: "2026-07-21T12:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /contracts/{id}/stats:
    get:
      operationId: contractStats
      summary: Get per-contract statistics
      description: >-
        Event count for one contract, plus cached token metadata (name,
        symbol, decimals) when the contract has been resolved as a token.
        The metadata fields are omitted for contracts with no cached
        metadata.
      tags: [Operations]
      parameters:
        - name: id
          in: path
          required: true
          description: The contract to describe.
          schema:
            type: string
            pattern: "^C[A-Z2-7]{55}$"
          example: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
      responses:
        "200":
          description: Contract statistics
          content:
            application/json:
              schema:
                type: object
                required: [contract_id, event_count]
                properties:
                  contract_id:
                    type: string
                    description: Stellar contract ID (C-prefixed)
                  name:
                    type: string
                    description: Token name, when cached metadata is available
                  symbol:
                    type: string
                    description: Token symbol, when cached metadata is available
                  decimals:
                    type: integer
                    description: Token decimals, when cached metadata is available
                  event_count:
                    type: integer
                    format: int64
                    description: Number of stored events for this contract
                  type_breakdown:
                    type: array
                    description: >-
                      Per-type event counts for this contract. Omitted when
                      the breakdown is unavailable.
                    items:
                      type: object
                      required: [type, count]
                      properties:
                        type:
                          type: string
                          description: Event type, e.g. contract or diagnostic
                        count:
                          type: integer
                          format: int64
                          description: Number of events of this type
              example:
                contract_id: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
                name: "Soroban Token"
                symbol: "STOK"
                decimals: 7
                event_count: 42
                type_breakdown:
                  - type: contract
                    count: 38
                  - type: diagnostic
                    count: 4
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /contracts/{id}/export:
    get:
      operationId: contractExport
      summary: Export a contract's events
      description: >-
        Streaming export of every stored event for one contract.
      tags: [Operations]
      parameters:
        - name: id
          in: path
          required: true
          description: The contract whose events to export.
          schema:
            type: string
            pattern: "^C[A-Z2-7]{55}$"
          example: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
        - name: from_ledger
          in: query
          required: true
          description: >-
            Inclusive lower ledger bound. Required, and must not be greater
            than to_ledger. Unlike the list endpoints the export refuses an
            open-ended range outright, so a missing bound cannot drain the
            database one stream at a time.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 256000
        - name: to_ledger
          in: query
          required: true
          description: >-
            Inclusive upper ledger bound. Required. The span it forms with
            from_ledger is capped by the EXPORT_MAX_RANGE environment
            variable, so a wide range may be refused by a deployment even
            though both bounds are individually valid.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 256999
        - name: format
          in: query
          description: Serialisation of the exported stream.
          schema:
            type: string
            enum: [csv, ndjson]
            default: csv
      responses:
        "200":
          description: Success
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /tenant:
    get:
      operationId: currentTenant
      summary: Describe the calling tenant
      description: >-
        The authenticated tenant's identity and grants.
      tags: [Operations]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
              example:
                id: 1
                name: "acme-corp"
                enabled: true
                grants:
                  - "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /tenant/usage:
    get:
      operationId: currentTenantUsage
      summary: Usage for the calling tenant
      description: >-
        Recorded request and event-served counters for the caller.
      tags: [Operations]
      parameters:
        - name: days
          in: query
          description: >-
            How many days of usage history to return, counting back from
            today.
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
          example: 7
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
              example:
                tenant_id: 1
                period_days: 7
                requests: 12345
                events_served: 67890
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /tenant/watch:
    get:
      operationId: tenantWatchList
      summary: List the tenant's watched contracts
      description: >-
        Contracts the calling tenant has asked the indexer to follow.
      tags: [Operations]
      responses:
        "200":
          description: Success
          headers:
            X-Total-Count:
              description: >-
                The total number of contracts the tenant watches, which is
                the full list since this endpoint is not paginated.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                type: object
              example:
                contracts:
                  - "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
                count: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: addTenantWatch
      summary: Add a contract to the tenant's watch list
      description: >-
        Adds a contract to the calling tenant's watch list.
      tags: [Operations]
      responses:
        "200":
          description: >-
            The tenant's refreshed watch list. Not a 201: the response is the
            whole list, not the created row.
          content:
            application/json:
              schema:
                type: object
              example:
                contracts:
                  - "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
                  - "CAAAA..."
                count: 2
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /tenant/watch/{contract_id}:
    delete:
      operationId: removeTenantWatch
      summary: Remove a contract from the tenant's watch list
      description: >-
        Removes a contract from the calling tenant's watch list.
      tags: [Operations]
      parameters:
        - name: contract_id
          in: path
          required: true
          description: The contract to drop from the calling tenant's watch list.
          schema:
            type: string
            pattern: "^C[A-Z2-7]{55}$"
          example: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
      responses:
        "200":
          description: >-
            The tenant's refreshed watch list. Not a 204: the response carries
            the remaining contracts.
          content:
            application/json:
              schema:
                type: object
              example:
                contracts:
                  - "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
                count: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /watched-contracts:
    get:
      operationId: listWatchedContracts
      summary: List watched contracts
      description: >-
        Contracts the indexer is following.
      tags: [Operations]
      security:
        - ManagementKey: []
      responses:
        "200":
          description: Success
          headers:
            X-Total-Count:
              description: >-
                The total number of watched contracts, which is the full list
                since this endpoint is not paginated.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                type: object
              example:
                contracts:
                  - contract_id: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
                    start_ledger: 256000
                count: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: addWatchedContract
      summary: Add a watched contract
      description: >-
        Starts ingesting a contract on the next poll.
      tags: [Operations]
      security:
        - ManagementKey: []
      responses:
        "200":
          description: >-
            The refreshed watch list, plus the ledger ingestion for the new
            contract will start from. Not a 201: the response is the whole
            list, not the created row.
          content:
            application/json:
              schema:
                type: object
              example:
                contracts:
                  - contract_id: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
                    start_ledger: 256000
                  - contract_id: "CAAAA..."
                    start_ledger: 256000
                count: 2
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /watched-contracts/{id}:
    delete:
      operationId: removeWatchedContract
      summary: Stop watching a contract
      description: >-
        Removes a contract from the watch list.
      tags: [Operations]
      parameters:
        - name: id
          in: path
          required: true
          description: The contract to stop following.
          schema:
            type: string
            pattern: "^C[A-Z2-7]{55}$"
          example: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
        - name: confirm
          in: query
          description: >-
            Must be "true" to remove the last watched contract, because
            emptying the list switches ingestion back from a specific list
            to all contract events. Not needed while other contracts remain.
          schema:
            type: string
            enum: ["true"]
      security:
        - ManagementKey: []
      responses:
        "200":
          description: >-
            The refreshed watch list. Not a 204: the response carries the
            remaining contracts.
          content:
            application/json:
              schema:
                type: object
              example:
                contracts:
                  - contract_id: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
                    start_ledger: 256000
                count: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
