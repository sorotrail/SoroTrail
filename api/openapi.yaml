openapi: "3.1.0"
info:
  title: SoroTrail
  description: |
    A contract event indexer for the Stellar/Soroban network. SoroTrail polls
    a Stellar RPC endpoint, stores contract events durably in Postgres, and
    serves them back through a queryable HTTP API long after the RPC has
    forgotten them.
  version: "0.1.0"
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /health:
    get:
      operationId: health
      summary: Dependency health check
      tags: [System]
      responses:
        "200":
          description: All dependencies healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: One or more dependencies degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /events:
    get:
      operationId: listEvents
      summary: List stored events
      description: |
        Paginated list of stored events, filterable by contract, type, topic,
        ledger range, time range, and sort order. Supports cursor-based
        pagination and optional spec-driven enrichment.
      tags: [Events]
      parameters:
        - $ref: "#/components/parameters/ContractID"
        - $ref: "#/components/parameters/EventType"
        - $ref: "#/components/parameters/Topic"
        - $ref: "#/components/parameters/Topic0"
        - $ref: "#/components/parameters/Topic1"
        - $ref: "#/components/parameters/Topic2"
        - $ref: "#/components/parameters/Topic3"
        - $ref: "#/components/parameters/FromLedger"
        - $ref: "#/components/parameters/ToLedger"
        - $ref: "#/components/parameters/FromTime"
        - $ref: "#/components/parameters/ToTime"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/Decoded"
      responses:
        "200":
          description: A page of events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteEvents
      summary: Delete events in a ledger range (retention/admin)
      tags: [Events]
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /events/{id}:
    get:
      operationId: getEvent
      summary: Get a single event by ID
      tags: [Events]
      parameters:
        - name: id
          in: path
          required: true
          description: TOID-based event identifier
          schema:
            type: string
            pattern: "^[0-9]{16}-[0-9]{10}$"
          example: "0001099511627776-0000000001"
        - $ref: "#/components/parameters/Decoded"
      responses:
        "200":
          description: The requested event
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Event"
                  - $ref: "#/components/schemas/EnrichedEvent"
        "304":
          description: Not modified (conditional GET with matching If-None-Match)
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /contracts/{id}/events:
    get:
      operationId: contractEvents
      summary: List events for a contract
      description: Convenience wrapper around GET /events with contract_id={id}
      tags: [Events]
      parameters:
        - name: id
          in: path
          required: true
          description: Stellar contract ID (C-prefixed)
          schema:
            type: string
            pattern: "^C[A-Z0-9]{55}$"
          example: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
        - $ref: "#/components/parameters/EventType"
        - $ref: "#/components/parameters/Topic"
        - $ref: "#/components/parameters/Topic0"
        - $ref: "#/components/parameters/Topic1"
        - $ref: "#/components/parameters/Topic2"
        - $ref: "#/components/parameters/Topic3"
        - $ref: "#/components/parameters/FromLedger"
        - $ref: "#/components/parameters/ToLedger"
        - $ref: "#/components/parameters/FromTime"
        - $ref: "#/components/parameters/ToTime"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/Decoded"
      responses:
        "200":
          description: A page of events for the contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /addresses/{address}/events:
    get:
      operationId: addressEvents
      summary: List events involving an address
      description: >-
        Events (for example SEP-41 transfers) that reference the given Stellar
        address. Always ordered by event id.
      tags: [Events]
      parameters:
        - name: address
          in: path
          required: true
          description: Stellar address (G-prefixed account or C-prefixed contract)
          schema:
            type: string
          example: "GDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
        - $ref: "#/components/parameters/FromLedger"
        - $ref: "#/components/parameters/ToLedger"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of events involving the address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /addresses/{address}/summary:
    get:
      operationId: addressSummary
      summary: Activity summary for an address
      description: >-
        Aggregate activity counters for the given Stellar address (total events
        and the ledger range over which it has been active).
      tags: [System]
      parameters:
        - name: address
          in: path
          required: true
          description: Stellar address (G-prefixed account or C-prefixed contract)
          schema:
            type: string
          example: "GDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
      responses:
        "200":
          description: Address activity summary
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /stats:
    get:
      operationId: stats
      summary: Indexer statistics
      tags: [System]
      responses:
        "200":
          description: Indexer statistics, including auditor counters when active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
        "500":
          $ref: "#/components/responses/InternalError"
  /events/ws:
    get:
      operationId: eventStreamWS
      summary: WebSocket live event stream
      description: |
        Upgrades to a WebSocket connection that pushes ingested events as they
        are stored. The stream starts at "now" — no replay of historical events.
        Use the same EventFilter query parameters as GET /events.
      tags: [Events]
      parameters:
        - $ref: "#/components/parameters/ContractID"
        - $ref: "#/components/parameters/EventType"
        - $ref: "#/components/parameters/Topic"
        - $ref: "#/components/parameters/Topic0"
        - $ref: "#/components/parameters/Topic1"
        - $ref: "#/components/parameters/Topic2"
        - $ref: "#/components/parameters/Topic3"
        - $ref: "#/components/parameters/FromLedger"
        - $ref: "#/components/parameters/ToLedger"
        - $ref: "#/components/parameters/FromTime"
        - $ref: "#/components/parameters/ToTime"
      responses:
        "101":
          description: WebSocket upgrade successful
        "400":
          $ref: "#/components/responses/BadRequest"
        "501":
          description: Streaming not configured (broadcaster disabled)
          content:
            text/plain:
              schema:
                type: string
                example: "streaming not configured"
  /subscriptions:
    post:
      operationId: createSubscription
      summary: Register a new webhook subscription
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionRequest"
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listSubscriptions
      summary: List all webhook subscriptions
      tags: [Webhooks]
      responses:
        "200":
          description: All registered subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
        "500":
          $ref: "#/components/responses/InternalError"
  /subscriptions/{id}:
    get:
      operationId: getSubscription
      summary: Get a single subscription by ID
      tags: [Webhooks]
      parameters:
        - name: id
          in: path
          required: true
          description: Subscription ID
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The requested subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: updateSubscription
      summary: Update a subscription
      description: Only fields present in the request body are changed.
      tags: [Webhooks]
      parameters:
        - name: id
          in: path
          required: true
          description: Subscription ID
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubscriptionRequest"
      responses:
        "200":
          description: The updated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteSubscription
      summary: Delete a subscription and its delivery history
      tags: [Webhooks]
      parameters:
        - name: id
          in: path
          required: true
          description: Subscription ID
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Deleted successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /subscriptions/{id}/deliveries:
    get:
      operationId: listDeliveries
      summary: List delivery attempts for a subscription
      tags: [Webhooks]
      parameters:
        - name: id
          in: path
          required: true
          description: Subscription ID
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          description: Maximum number of deliveries to return (1-200, default 50)
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Delivery attempts, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeliveryAttempt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/keys/{key_id}:
    delete:
      operationId: deleteAdminKeys
      summary: DELETE /admin/keys/{key_id}
      tags: [Admin]
