components:
  parameters:
    ContractID:
      name: contract_id
      in: query
      description: |
        Filter by contract ID. Accepts a single Stellar contract strkey, or
        several separated by commas, in which case events from any of them
        match. Every element is validated: one typo rejects the whole
        request rather than silently narrowing the result to nothing.

        The alphabet is base32 (`A`-`Z` and `2`-`7`), so `0`, `1`, `8` and
        `9` never appear in a contract ID.
      schema:
        type: string
        pattern: "^C[A-Z2-7]{55}(,C[A-Z2-7]{55})*$"
      example: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
    EventType:
      name: type
      in: query
      description: >-
        Filter by event type. Accepts several types separated by commas, in
        which case events of any listed type match. An unrecognised type is
        rejected rather than ignored.
      schema:
        type: string
        pattern: "^(contract|system|diagnostic)(,(contract|system|diagnostic))*$"
      example: "contract,diagnostic"
    Topic:
      name: topic
      in: query
      description: |
        Exact JSON match against any topic position. Cannot be combined with
        topic0..topic3 — a request carrying both is rejected, because the
        two ask different questions and silently preferring one would hide
        the mistake.

        A value that parses as JSON is used as-is; anything else is treated
        as a JSON string, so `transfer` and `"transfer"` mean the same
        thing.
      schema:
        type: string
      example: '{"symbol":"transfer"}'
    Topic0:
      name: topic0
      in: query
      description: >-
        Exact JSON match against topic position 0, usually the event name.
        Same value rules as topic, and likewise cannot be combined with it.
      schema:
        type: string
      example: '{"symbol":"transfer"}'
    Topic1:
      name: topic1
      in: query
      description: >-
        Exact JSON match against topic position 1. Same value rules as
        topic, and likewise cannot be combined with it.
      schema:
        type: string
      example: '{"address":"GDW6AUTBXTOC7FIKUO5BOO3OGLK4SF7ZPOBLMQHMZDI45J2Z6VXRB5NR"}'
    Topic2:
      name: topic2
      in: query
      description: >-
        Exact JSON match against topic position 2. Same value rules as
        topic, and likewise cannot be combined with it.
      schema:
        type: string
      example: '{"address":"GBUKOFF6BLZID2WGVUOFQNPJXBAY3HRUYBOG5DXCTNRHOMCVQ4KKXOTQ"}'
    Topic3:
      name: topic3
      in: query
      description: >-
        Exact JSON match against topic position 3. Same value rules as
        topic, and likewise cannot be combined with it.
      schema:
        type: string
      example: '{"string":"native"}'
    FromLedger:
      name: from_ledger
      in: query
      description: >-
        Inclusive lower ledger bound. Must be a positive integer; zero is
        rejected rather than treated as "unbounded", so a miscomputed bound
        cannot silently widen a query. When to_ledger is also given,
        from_ledger must not be greater than it.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 256000
    ToLedger:
      name: to_ledger
      in: query
      description: >-
        Inclusive upper ledger bound. Must be a positive integer; zero is
        rejected rather than treated as "unbounded". When from_ledger is
        also given, it must not be greater than this value.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 256999
    FromTime:
      name: from_time
      in: query
      description: >-
        Inclusive lower created_at bound, as an RFC 3339 timestamp with a
        timezone and whole-second precision. Sub-second precision is
        rejected rather than truncated, because a truncated bound would
        quietly include or exclude a boundary event. When to_time is also
        given, from_time must not be after it.
      schema:
        type: string
        format: date-time
      example: "2026-07-21T00:00:00Z"
    ToTime:
      name: to_time
      in: query
      description: >-
        Inclusive upper created_at bound, as an RFC 3339 timestamp with a
        timezone and whole-second precision. Sub-second precision is
        rejected rather than truncated. When from_time is also given, it
        must not be after this value.
      schema:
        type: string
        format: date-time
      example: "2026-07-22T00:00:00Z"
    Limit:
      name: limit
      in: query
      description: |
        Page size. Out-of-range values are rejected rather than clamped, so
        a caller asking for more than it may have finds out instead of
        silently receiving a short page and assuming it reached the end.

        The ceiling is 500. An operator can lower it with the API_MAX_LIMIT
        environment variable, so a deployment may reject a value this schema
        permits; the store never returns more than 500 rows in one page
        regardless.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
      example: 100
    ContractsLimit:
      name: limit
      in: query
      description: >-
        Page size for the contract listing. Bounded tighter than the event
        endpoints, and by a compile-time constant rather than API_MAX_LIMIT,
        because the listing is a grouped scan over the events table — one
        row of output costs far more than one event does.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      example: 100
    Cursor:
      name: cursor
      in: query
      description: |
        Opaque pagination cursor. Pass back the cursor a previous response
        returned, unchanged; clients must not construct, parse or modify
        one, and its encoding is not part of this API's contract.

        A cursor is only meaningful for the ordering that produced it.
        Replaying one against a different order_by is rejected rather than
        silently restarting the walk. The absence of a cursor in a response
        means that page was the last one.
      schema:
        type: string
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    Order:
      name: order
      in: query
      description: >-
        Sort direction for the order_by key. Cannot be combined with the
        recent shorthand, which pins the direction itself.
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    OrderBy:
      name: order_by
      in: query
      description: >-
        Sort key. Whichever key is chosen also decides which cursors are
        valid for the walk, so changing it mid-pagination means starting
        over. Cannot be combined with the recent shorthand.
      schema:
        type: string
        enum: [id, ledger, created_at]
        default: id
    Decoded:
      name: decoded
      in: query
      description: >-
        When "true", enrich events with spec-driven named fields. Any other
        value leaves the response undecoded; only the exact string "true"
        turns enrichment on. Enrichment is skipped silently when no contract
        spec is available, so a decoded request is never an error.
      schema:
        type: string
        enum: ["true"]
  schemas:
    ErrorResponse:
      type: object
      description: Standard error envelope
      properties:
        error:
          type: string
          description: Human-readable error message
      required: [error]
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            type: string
          example:
            database: ok
            rpc: ok
      required: [status, checks]
    Event:
      type: object
      description: A Stellar/Soroban contract event
      properties:
        id:
          type: string
          description: TOID-based event identifier
          example: "0001099511627776-0000000001"
        contract_id:
          type: string
          description: Contract ID
          example: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
        ledger:
          type: integer
          description: Ledger sequence number
          example: 256000
        type:
          type: string
          enum: [contract, system, diagnostic]
        tx_hash:
          type: string
          description: Transaction hash
          example: "9f5c..."
        tx_index:
          type: integer
          description: Transaction index within the ledger
        op_index:
          type: integer
          description: Operation index within the transaction
        in_successful_call:
          type: boolean
          description: Whether the event was emitted in a successful call
        topics:
          type: array
          description: Event topic values (JSON-encoded)
          items:
            schema:
              type: object
        value:
          description: Event value (JSON-encoded)
        created_at:
          type: string
          format: date-time
          description: When the event was persisted
      required: [id, contract_id, ledger, type, tx_hash, tx_index, op_index, in_successful_call, topics, value, created_at]
    EnrichedEvent:
      allOf:
        - $ref: "#/components/schemas/Event"
        - type: object
          properties:
            decoded_event:
              type: object
              nullable: true
              properties:
                event:
                  type: string
                fields:
                  type: object
                  additionalProperties: true
            decoded:
              type: boolean
    EventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/Event"
              - $ref: "#/components/schemas/EnrichedEvent"
        cursor:
          type: string
          description: Present when more results exist; pass back as ?cursor=
      required: [events]
    Stats:
      type: object
      properties:
        total_events:
          type: integer
        last_ingested_ledger:
          type: integer
        verified_through_ledger:
          type: integer
        contract_count:
          type: integer
        watched_contracts:
          type: integer
        auditor:
          type: object
          nullable: true
          properties:
            passes_run:
              type: integer
            ledgers_checked:
              type: integer
            findings_opened:
              type: integer
            findings_repaired:
              type: integer
            findings_unverifiable:
              type: integer
            findings_unrecoverable:
              type: integer
            rpc_requests:
              type: integer
    CreateSubscriptionRequest:
      type: object
      required: [url, secret]
      properties:
        url:
          type: string
          format: uri
          description: Callback URL
          example: "https://example.com/webhook"
        secret:
          type: string
          description: HMAC-SHA256 secret for payload verification
          example: "whsec_z8eP5qL3vR2xK9yB4w"
        filters:
          $ref: "#/components/schemas/SubscriptionFilter"
        enabled:
          type: boolean
          description: Defaults to true
    UpdateSubscriptionRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
        secret:
          type: string
        filters:
          $ref: "#/components/schemas/SubscriptionFilter"
        enabled:
          type: boolean
    SubscriptionFilter:
      type: object
      description: Filter that callbacks use to select which events to deliver. An empty filter matches every event.
      properties:
        contract_id:
          type: string
        type:
          type: string
          enum: [contract, system, diagnostic]
        topic:
          description: Exact JSON match against any topic position
        from_ledger:
          type: integer
        to_ledger:
          type: integer
    Subscription:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
        filters:
          $ref: "#/components/schemas/SubscriptionFilter"
        secret:
          type: string
        enabled:
          type: boolean
        failure_count:
          type: integer
        created_at:
          type: string
          format: date-time
      required: [id, url, filters, secret, enabled, failure_count, created_at]
    DeliveryAttempt:
      type: object
      properties:
        id:
          type: integer
        subscription_id:
          type: integer
        event_id:
          type: string
        status:
          type: string
        response_code:
          type: integer
        duration_ms:
          type: integer
        error:
          type: string
        created_at:
          type: string
          format: date-time
      required: [id, subscription_id, event_id, status, response_code, duration_ms, created_at]
    ContractSummary:
      type: object
      properties:
        contract_id:
          type: string
        event_count:
          type: integer
          description: Total stored events for this contract
        first_ledger:
          type: integer
          description: Oldest ledger with a stored event for this contract
        last_ledger:
          type: integer
          description: Newest ledger with a stored event for this contract
        last_seen:
          type: string
          format: date-time
          description: Wall-clock time the most recent event was ingested
      required: [contract_id, event_count, first_ledger, last_ledger, last_seen]
    ContractsPage:
      type: object
      properties:
        contracts:
          type: array
          items:
            $ref: "#/components/schemas/ContractSummary"
        count:
          type: integer
          description: Number of contracts on this page
        cursor:
          type: string
          description: Present when more results exist; pass back as ?cursor=
      required: [contracts, count]
  securitySchemes:
    TenantAuth:
      type: http
      scheme: bearer
      description: |
        The tenant API key issued by POST /admin/tenants/{id}/keys, presented
        as `Authorization: Bearer st_<prefix>_<secret>`. The same key is also
        accepted in an `X-API-Key` header (see TenantAuthHeader); Bearer wins
        when both are present.

        Only enforced when the instance runs with MULTI_TENANT=true. On a
        single-tenant instance every request is served as an implicit
        wildcard principal and no credential is required, which is why most
        operations list this scheme as optional rather than required.
    TenantAuthHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        The same tenant API key as TenantAuth, presented in a header instead
        of a Bearer token.
    ManagementKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        The operator's instance-wide management key, configured through the
        API_KEY environment variable. It gates the endpoints that mutate
        ingestion or read the dead-letter queue, and it is always required on
        those endpoints — independently of MULTI_TENANT, and independently of
        the tenant credential above.

        When API_KEY is unset the server fails closed: those endpoints answer
        503 rather than running unauthenticated.
  responses:
    NotModified:
      description: >-
        The cached copy is still current. Returned for a conditional GET
        whose If-None-Match matches the resource's current ETag. The body is
        empty; the validators are repeated so the client can refresh its
        cache entry.
      headers:
        ETag:
          description: The validator that matched.
          schema:
            type: string
        Cache-Control:
          description: The caching policy for the unchanged resource.
          schema:
            type: string
    BadRequest:
      description: >-
        The request could not be parsed or violates a documented constraint —
        a malformed identifier, an out-of-range limit, an unparseable cursor,
        or a JSON body the endpoint cannot decode. The message names the
        offending parameter.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: |
        No credential was presented, or the one presented is malformed,
        unknown or revoked.

        Which credential is missing depends on the endpoint's security
        requirement: endpoints requiring ManagementKey want the operator's
        `X-API-Key`, while everything else wants the tenant key and only
        rejects when the instance runs with MULTI_TENANT=true.
      headers:
        WWW-Authenticate:
          description: >-
            The authentication challenge, per RFC 7235 §4.1 — for example
            `Bearer realm="sorotrail"`. Present on the tenant-authentication
            failures; the ManagementKey path answers without a challenge
            because it accepts no Bearer token.
          schema:
            type: string
            examples: ['Bearer realm="sorotrail"']
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: >-
        The credential is valid but does not entitle the caller to what it
        asked for: a disabled tenant, a non-admin calling an admin endpoint,
        or a request naming a contract outside the tenant's grants. Contract
        IDs are public on-chain identifiers, so a request for an ungranted
        contract is answered 403 rather than 404.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: >-
        The addressed resource does not exist, or is not visible to the
        caller. Event lookups answer 404 rather than 403 for an event the
        caller may not read, so the endpoint cannot be used as an existence
        oracle. The tenant and admin endpoints also answer 404 when the
        instance runs single-tenant and those routes are therefore inert.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: >-
        The request collides with the current state — a duplicate tenant
        name, or a tenant attempting to delete the account it is
        authenticated as.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: |
        The caller exceeded its request quota, or asked to watch more
        contracts than its quota allows.

        Rate limiting is per client — keyed on the authenticated tenant where
        one exists and on the client IP otherwise — and is only active when
        the operator configured RATE_LIMIT_RPS or a per-tenant override. The
        probe and scrape endpoints (/health, /livez, /readyz, /metrics) are
        never rate limited, so throttling cannot blind an operator to the
        throttling itself.
      headers:
        Retry-After:
          description: >-
            Whole seconds to wait before retrying, per RFC 7231 §7.1.3.
            Always at least 1, and rounded up from the limiter's own
            wait-to-next-token estimate.
          schema:
            type: integer
            minimum: 1
            examples: [1]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: >-
        The request failed for a reason the caller cannot act on — a store or
        RPC failure, or a panic caught by the recovery middleware. The
        message is deliberately generic; the specifics are logged against the
        request's X-Request-ID rather than returned.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotImplemented:
      description: >-
        The endpoint exists but the feature behind it is not configured on
        this instance. Returned by the live event stream when the broadcaster
        is disabled. This one response is plain text rather than the error
        envelope, because it is written before the endpoint's JSON contract
        begins.
      content:
        text/plain:
          schema:
            type: string
            examples: ["streaming not configured"]
    ServiceUnavailable:
      description: >-
        The endpoint is temporarily unusable. The management endpoints answer
        this when API_KEY is unset, failing closed so that writes are never
        open on a misconfigured instance.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
