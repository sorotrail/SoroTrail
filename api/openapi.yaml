        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /metrics:
    get:
      operationId: metrics
      summary: Prometheus metrics exposition
      tags: [System]
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  parameters:
    ContractID:
      name: contract_id
      in: query
      description: Filter by contract ID (C-prefixed Stellar address)
      schema:
        type: string
        pattern: "^C[A-Z0-9]{55}$"
      example: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
    EventType:
      name: type
      in: query
      description: Filter by event type
      schema:
        type: string
        enum: [contract, system, diagnostic]
    Topic:
      name: topic
      in: query
      description: |
        Exact JSON match against any topic position. Cannot be combined with
        topic0..topic3. A bare word is treated as a JSON string.
      schema:
        type: string
      example: '{"symbol":"transfer"}'
    Topic0:
      name: topic0
      in: query
      description: Exact JSON match against topic position 0
      schema:
        type: string
      example: '{"symbol":"transfer"}'
    Topic1:
      name: topic1
      in: query
      description: Exact JSON match against topic position 1
      schema:
        type: string
    Topic2:
      name: topic2
      in: query
      description: Exact JSON match against topic position 2
      schema:
        type: string
    Topic3:
      name: topic3
      in: query
      description: Exact JSON match against topic position 3
      schema:
        type: string
    FromLedger:
      name: from_ledger
      in: query
      description: Inclusive lower ledger bound
      schema:
        type: integer
        minimum: 1
    ToLedger:
      name: to_ledger
      in: query
      description: Inclusive upper ledger bound
      schema:
        type: integer
        minimum: 1
    FromTime:
      name: from_time
      in: query
      description: Inclusive lower created_at bound (RFC 3339). Sub-second precision and missing timezone are rejected.
      schema:
        type: string
        format: date-time
      example: "2026-07-21T00:00:00Z"
    ToTime:
      name: to_time
      in: query
      description: Inclusive upper created_at bound (RFC 3339). Sub-second precision and missing timezone are rejected.
      schema:
        type: string
        format: date-time
      example: "2026-07-22T00:00:00Z"
    Limit:
      name: limit
      in: query
      description: Page size
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque pagination cursor from a previous response
      schema:
        type: string
      example: "0001099511627776-0000000001"
    Order:
      name: order
      in: query
      description: Sort direction
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    Decoded:
      name: decoded
      in: query
      description: When true, enrich events with spec-driven named fields
      schema:
        type: string
        enum: ["true"]
  schemas:
    ErrorResponse:
      type: object
      description: Standard error envelope
      properties:
        error:
          type: string
          description: Human-readable error message
      required: [error]
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            type: string
          example:
            database: ok
            rpc: ok
      required: [status, checks]
    Event:
      type: object
      description: A Stellar/Soroban contract event
      properties:
        id:
          type: string
          description: TOID-based event identifier
          example: "0001099511627776-0000000001"
        contract_id:
          type: string
          description: Contract ID
          example: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
        ledger:
          type: integer
          description: Ledger sequence number
          example: 256000
        type:
          type: string
          enum: [contract, system, diagnostic]
        tx_hash:
          type: string
          description: Transaction hash
          example: "9f5c..."
        tx_index:
          type: integer
          description: Transaction index within the ledger
        op_index:
          type: integer
          description: Operation index within the transaction
        in_successful_call:
          type: boolean
          description: Whether the event was emitted in a successful call
        topics:
          type: array
          description: Event topic values (JSON-encoded)
          items:
            schema:
              type: object
        value:
          description: Event value (JSON-encoded)
        created_at:
          type: string
          format: date-time
          description: When the event was persisted
      required: [id, contract_id, ledger, type, tx_hash, tx_index, op_index, in_successful_call, topics, value, created_at]
    EnrichedEvent:
      allOf:
        - $ref: "#/components/schemas/Event"
        - type: object
          properties:
            decoded_event:
              type: object
              nullable: true
              properties:
                event:
                  type: string
                fields:
                  type: object
                  additionalProperties: true
            decoded:
              type: boolean
    EventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/Event"
              - $ref: "#/components/schemas/EnrichedEvent"
        cursor:
          type: string
          description: Present when more results exist; pass back as ?cursor=
      required: [events]
    Stats:
      type: object
      properties:
        total_events:
          type: integer
        last_ingested_ledger:
          type: integer
        verified_through_ledger:
          type: integer
        contract_count:
          type: integer
        watched_contracts:
          type: integer
        auditor:
          type: object
          nullable: true
          properties:
            passes_run:
              type: integer
            ledgers_checked:
              type: integer
            findings_opened:
              type: integer
            findings_repaired:
              type: integer
            findings_unverifiable:
              type: integer
            findings_unrecoverable:
              type: integer
            rpc_requests:
              type: integer
    CreateSubscriptionRequest:
      type: object
      required: [url, secret]
      properties:
        url:
          type: string
          format: uri
          description: Callback URL
          example: "https://example.com/webhook"
        secret:
          type: string
          description: HMAC-SHA256 secret for payload verification
          example: "whsec_z8eP5qL3vR2xK9yB4w"
        filters:
          $ref: "#/components/schemas/SubscriptionFilter"
        enabled:
          type: boolean
          description: Defaults to true
    UpdateSubscriptionRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
        secret:
          type: string
        filters:
          $ref: "#/components/schemas/SubscriptionFilter"
        enabled:
          type: boolean
    SubscriptionFilter:
      type: object
      description: Filter that callbacks use to select which events to deliver. An empty filter matches every event.
      properties:
        contract_id:
          type: string
        type:
          type: string
          enum: [contract, system, diagnostic]
        topic:
          description: Exact JSON match against any topic position
        from_ledger:
          type: integer
        to_ledger:
          type: integer
    Subscription:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
        filters:
          $ref: "#/components/schemas/SubscriptionFilter"
        secret:
          type: string
        enabled:
          type: boolean
        failure_count:
          type: integer
        created_at:
          type: string
          format: date-time
      required: [id, url, filters, secret, enabled, failure_count, created_at]
    DeliveryAttempt:
      type: object
      properties:
        id:
          type: integer
        subscription_id:
          type: integer
        event_id:
          type: string
        status:
          type: string
        response_code:
          type: integer
        duration_ms:
          type: integer
        error:
          type: string
        created_at:
          type: string
          format: date-time
      required: [id, subscription_id, event_id, status, response_code, duration_ms, created_at]
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
