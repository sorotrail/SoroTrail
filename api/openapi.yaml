openapi: "3.1.0"
info:
  title: SoroTrail API
  description: |
    A contract event indexer for the Stellar/Soroban network. SoroTrail polls
    a Stellar RPC endpoint, stores contract events durably in Postgres, and
    serves them back through a queryable HTTP API long after the RPC has
    forgotten them.
  version: "0.1.0"
servers:
  - url: http://localhost:8080
    description: Local development
# Authentication is instance-dependent, so the default requirement lists the
# tenant credential alongside the empty requirement: a MULTI_TENANT=true
# deployment rejects an anonymous caller with 401, and a single-tenant one
# serves it. Operations that are gated regardless override this with their
# own security block.
security:
  - TenantAuth: []
  - TenantAuthHeader: []
  - {}
paths:
  /health:
    get:
      operationId: health
      summary: Dependency health check
      tags: [System]
      security: []
      responses:
        "200":
          description: All dependencies healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                checks:
                  database: ok
                  rpc: ok
        "503":
          description: One or more dependencies degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: degraded
                checks:
                  database: ok
                  rpc: unavailable
  /events:
    get:
      operationId: listEvents
      summary: List stored events
      description: |
        Paginated list of stored events, filterable by contract, type, topic,
        ledger range, time range, and sort order. Supports cursor-based
        pagination and optional spec-driven enrichment.
      tags: [Events]
      parameters:
        - $ref: "#/components/parameters/ContractID"
        - $ref: "#/components/parameters/EventType"
        - $ref: "#/components/parameters/Topic"
        - $ref: "#/components/parameters/Topic0"
        - $ref: "#/components/parameters/Topic1"
        - $ref: "#/components/parameters/Topic2"
        - $ref: "#/components/parameters/Topic3"
        - $ref: "#/components/parameters/FromLedger"
        - $ref: "#/components/parameters/ToLedger"
        - $ref: "#/components/parameters/FromTime"
        - $ref: "#/components/parameters/ToTime"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/OrderBy"
        - $ref: "#/components/parameters/Decoded"
      responses:
        "200":
          description: A page of events
          headers:
            X-Total-Count:
              description: >-
                The total number of events matching the request's filters,
                ignoring pagination. Omitted when the count could not be
                computed; the page itself is still returned.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsResponse"
              example:
                events:
                  - id: "0001099511627776-0000000001"
                    contract_id: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
                    ledger: 256000
                    type: contract
                    tx_hash: "9f5c7a2b..."
                    tx_index: 0
                    op_index: 0
                    in_successful_call: true
                    topics:
                      - {"symbol":"transfer"}
                    value: {"address":"GDW6AUTBXTOC7FIKUO5BOO3OGLK4SF7ZPOBLMQHMZDI45J2Z6VXRB5NR"}
                    created_at: "2026-07-21T12:00:00Z"
                cursor: "MjU2MDAwLTAwMDAwMDAwMDE="
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteEvents
      summary: Prune stored events
      description: >-
        Deletes stored events matching the given bounds. Intended for
        retention maintenance; gated behind the management credential.
      tags: [Operations]
      parameters:
        - name: before_ledger
          in: query
          required: true
          description: >-
            Delete every stored event in a ledger strictly below this one.
            Required: without it the request is refused rather than
            defaulting to a bound that would delete everything.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 256000
      security:
        - ManagementKey: []
      responses:
        "200":
          description: Number of events deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
                    format: int64
              example:
                deleted: 42
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /events/{id}:
    get:
      operationId: getEvent
      summary: Get a single event by ID
      tags: [Events]
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            TOID-based event identifier: the 16-digit ledger/transaction/
            operation offset, a hyphen, and a 10-digit index within the
            operation. Take it from an event in a listing rather than
            composing it.
          schema:
            type: string
            pattern: "^[0-9]{16}-[0-9]{10}$"
          example: "0001099511627776-0000000001"
        - $ref: "#/components/parameters/Decoded"
      responses:
        "200":
          description: The requested event
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Event"
                  - $ref: "#/components/schemas/EnrichedEvent"
              example:
                id: "0001099511627776-0000000001"
                contract_id: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
                ledger: 256000
                type: contract
                tx_hash: "9f5c7a2b..."
                tx_index: 0
                op_index: 0
                in_successful_call: true
                topics:
                  - {"symbol":"transfer"}
                value: {"address":"GDW6AUTBXTOC7FIKUO5BOO3OGLK4SF7ZPOBLMQHMZDI45J2Z6VXRB5NR"}
                created_at: "2026-07-21T12:00:00Z"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /contracts/{id}/events:
    get:
      operationId: contractEvents
      summary: List events for a contract
      description: Convenience wrapper around GET /events with contract_id={id}
      tags: [Events]
      parameters:
        - name: id
          in: path
          required: true
          description: The contract whose events to return.
          schema:
            type: string
            pattern: "^C[A-Z2-7]{55}$"
          example: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
        - $ref: "#/components/parameters/EventType"
        - $ref: "#/components/parameters/Topic"
        - $ref: "#/components/parameters/Topic0"
        - $ref: "#/components/parameters/Topic1"
        - $ref: "#/components/parameters/Topic2"
        - $ref: "#/components/parameters/Topic3"
        - $ref: "#/components/parameters/FromLedger"
        - $ref: "#/components/parameters/ToLedger"
        - $ref: "#/components/parameters/FromTime"
        - $ref: "#/components/parameters/ToTime"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/OrderBy"
        - $ref: "#/components/parameters/Decoded"
      responses:
        "200":
          description: A page of events for the contract
          headers:
            X-Total-Count:
              description: >-
                The total number of events matching the request's filters,
                ignoring pagination. Omitted when the count could not be
                computed; the page itself is still returned.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsResponse"
              example:
                events:
                  - id: "0001099511627776-0000000001"
                    contract_id: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
                    ledger: 256000
                    type: contract
                    tx_hash: "9f5c7a2b..."
                    tx_index: 0
                    op_index: 0
                    in_successful_call: true
                    topics:
                      - {"symbol":"transfer"}
                    value: {"address":"GDW6AUTBXTOC7FIKUO5BOO3OGLK4SF7ZPOBLMQHMZDI45J2Z6VXRB5NR"}
                    created_at: "2026-07-21T12:00:00Z"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /addresses/{address}/events:
    get:
      operationId: addressEvents
      summary: List events involving an address
      description: >-
        Events where the given Stellar address appears in the event topics,
        as either sender or recipient. Backed by the address activity index.
      tags: [Events]
      parameters:
        - name: address
          in: path
          required: true
          description: >-
            Stellar account (G-prefixed) or contract (C-prefixed) address to
            look for in the event topics.
          schema:
            type: string
            pattern: "^[GC][A-Z2-7]{55}$"
          example: "GDW6AUTBXTOC7FIKUO5BOO3OGLK4SF7ZPOBLMQHMZDI45J2Z6VXRB5NR"
        - $ref: "#/components/parameters/FromLedger"
        - $ref: "#/components/parameters/ToLedger"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: A page of events involving the address
          headers:
            X-Total-Count:
              description: >-
                The total number of events matching the request's filters,
                ignoring pagination. Omitted when the count could not be
                computed; the page itself is still returned.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsResponse"
              example:
                events:
                  - id: "0001099511627776-0000000001"
                    contract_id: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
                    ledger: 256000
                    type: contract
                    tx_hash: "9f5c7a2b..."
                    tx_index: 0
                    op_index: 0
                    in_successful_call: true
                    topics:
                      - {"symbol":"transfer"}
                    value: {"address":"GDW6AUTBXTOC7FIKUO5BOO3OGLK4SF7ZPOBLMQHMZDI45J2Z6VXRB5NR"}
                    created_at: "2026-07-21T12:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /addresses/{address}/summary:
    get:
      operationId: addressSummary
      summary: Summarise an address's event history
      description: >-
        Aggregate view of an address's activity: first and last ledger it was
        seen in, total event count, and the contracts it interacted with.
      tags: [Events]
      parameters:
        - name: address
          in: path
          required: true
          description: >-
            Stellar account (G-prefixed) or contract (C-prefixed) address to
            summarise.
          schema:
            type: string
            pattern: "^[GC][A-Z2-7]{55}$"
          example: "GDW6AUTBXTOC7FIKUO5BOO3OGLK4SF7ZPOBLMQHMZDI45J2Z6VXRB5NR"
      responses:
        "200":
          description: Aggregate activity for the address
          content:
            application/json:
              schema:
                type: object
              example:
                address: "GDW6AUTBXTOC7FIKUO5BOO3OGLK4SF7ZPOBLMQHMZDI45J2Z6VXRB5NR"
                first_ledger: 256000
                last_ledger: 256050
                event_count: 12
                contracts:
                  - "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/tenants:
    get:
      operationId: listTenants
      summary: List tenants
      description: >-
        Administrative endpoint, available only when MULTI_TENANT is enabled
        and gated behind the admin credential.
      tags: [Admin]
      responses:
        "200":
          description: Success
          headers:
            X-Total-Count:
              description: >-
                The total number of tenants, which is the full list since
                this endpoint is not paginated.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                type: object
              example:
                tenants:
                  - id: 1
                    name: "acme-corp"
                    enabled: true
                    created_at: "2026-07-21T00:00:00Z"
                count: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createTenant
      summary: Create a tenant
      description: >-
        Administrative endpoint, available only when MULTI_TENANT is enabled
        and gated behind the admin credential.
      tags: [Admin]
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
              example:
                id: 1
                name: "acme-corp"
                enabled: true
                created_at: "2026-07-21T00:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/tenants/{id}:
    get:
      operationId: getTenant
      summary: Get a tenant
      description: >-
        Administrative endpoint, available only when MULTI_TENANT is enabled
        and gated behind the admin credential.
      tags: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            Tenant ID, as returned by POST /admin/tenants. Must be a
            positive integer.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
              example:
                id: 1
                name: "acme-corp"
                enabled: true
                created_at: "2026-07-21T00:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateTenant
      summary: Update a tenant
      description: >-
        Administrative endpoint, available only when MULTI_TENANT is enabled
        and gated behind the admin credential.
      tags: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            Tenant ID, as returned by POST /admin/tenants. Must be a
            positive integer.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
              example:
                id: 1
                name: "acme-corp"
                enabled: true
                created_at: "2026-07-21T00:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteTenant
      summary: Delete a tenant
      description: >-
        Administrative endpoint, available only when MULTI_TENANT is enabled
        and gated behind the admin credential.
      tags: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            Tenant ID, as returned by POST /admin/tenants. Must be a
            positive integer.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/tenants/{id}/usage:
    get:
      operationId: tenantUsage
      summary: Get a tenant's recorded usage
      description: >-
        Administrative endpoint, available only when MULTI_TENANT is enabled
        and gated behind the admin credential.
      tags: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            Tenant ID, as returned by POST /admin/tenants. Must be a
            positive integer.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1
        - name: days
          in: query
          description: >-
            How many days of usage history to return, counting back from
            today.
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
          example: 7
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
              example:
                tenant_id: 1
                period_days: 7
                requests: 12345
                events_served: 67890
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/tenants/{id}/grants:
    get:
      operationId: listTenantGrants
      summary: List a tenant's contract grants
      description: >-
        Administrative endpoint, available only when MULTI_TENANT is enabled
        and gated behind the admin credential.
      tags: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            Tenant ID, as returned by POST /admin/tenants. Must be a
            positive integer.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1
      responses:
        "200":
          description: Success
          headers:
            X-Total-Count:
              description: >-
                The total number of granted contracts, which is the full list
                since this endpoint is not paginated.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                type: object
              example:
                grants:
                  - "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
                count: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: grantContract
      summary: Grant a contract to a tenant
      description: >-
        Administrative endpoint, available only when MULTI_TENANT is enabled
        and gated behind the admin credential.
      tags: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            Tenant ID, as returned by POST /admin/tenants. Must be a
            positive integer.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1
      responses:
        "200":
          description: >-
            The tenant's refreshed grant list. Not a 201: the response is the
            whole list, not the created grant.
          content:
            application/json:
              schema:
                type: object
              example:
                grants:
                  - "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
                  - "CAAAA..."
                count: 2
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/tenants/{id}/grants/{contract_id}:
    delete:
      operationId: revokeContract
      summary: Revoke a contract grant
      description: >-
        Administrative endpoint, available only when MULTI_TENANT is enabled
        and gated behind the admin credential.
      tags: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            Tenant ID, as returned by POST /admin/tenants. Must be a
            positive integer.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1
        - name: contract_id
          in: path
          required: true
          description: The contract grant to revoke from this tenant.
          schema:
            type: string
            pattern: "^C[A-Z2-7]{55}$"
          example: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
      responses:
        "200":
          description: >-
            The tenant's refreshed grant list. Not a 204: the response carries
            the remaining grants.
          content:
            application/json:
              schema:
                type: object
              example:
                grants:
                  - "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
                count: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/tenants/{id}/keys:
    get:
      operationId: listTenantKeys
      summary: List a tenant's API keys
      description: >-
        Administrative endpoint, available only when MULTI_TENANT is enabled
        and gated behind the admin credential.
      tags: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            Tenant ID, as returned by POST /admin/tenants. Must be a
            positive integer.
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1
      responses:
        "200":
          description: Success
          headers:
            X-Total-Count:
              description: >-
                The total number of API keys, which is the full list since
                this endpoint is not paginated.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                type: object
