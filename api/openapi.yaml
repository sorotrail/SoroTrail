        - name: contract_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /tenant/watch/{contract_id}:
    delete:
      operationId: deleteTenantWatch
      summary: DELETE /tenant/watch/{contract_id}
      tags: [Tenant]
      parameters:
        - name: contract_id
          in: path
