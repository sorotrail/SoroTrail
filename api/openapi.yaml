    get:
      operationId: listDeadLetters
      summary: List dead-lettered events
      description: >-
        Events that failed to decode or persist and were set aside instead of stalling ingestion.
      tags: [Operations]
      security:
        - ManagementKey: []
      parameters:
        - name: contract_id
          in: query
          description: >-
            Only list dead letters recorded for this contract. Matched
            exactly, and not validated as a strkey — a dead letter can be
            recorded for input the decoder could not make sense of.
          schema:
            type: string
          example: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Success
          headers:
            X-Total-Count:
              description: >-
                The total number of dead-letter rows matching the request's
