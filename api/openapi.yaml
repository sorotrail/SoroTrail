                could not be computed; the page itself is still returned.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                type: object
              example:
                dead_letters:
                  - id: 42
                    contract_id: "CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC"
