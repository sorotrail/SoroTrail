---
# Source: sorotrail/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sorotrail
  labels:
    helm.sh/chart: sorotrail-0.1.0
    app.kubernetes.io/name: sorotrail
    app.kubernetes.io/instance: sorotrail
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sorotrail
      app.kubernetes.io/instance: sorotrail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sorotrail
        app.kubernetes.io/instance: sorotrail
    spec:
      serviceAccountName: sorotrail
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: sorotrail
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          image: "ghcr.io/sorotrail/sorotrail:latest"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sorotrail
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sorotrail-db
                  key: DATABASE_URL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {}
