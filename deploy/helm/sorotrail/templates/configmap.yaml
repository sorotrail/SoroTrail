apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sorotrail.fullname" . }}
  labels:
    {{- include "sorotrail.labels" . | nindent 4 }}
data:
  RPC_URL: {{ .Values.config.rpcUrl | quote }}
  POLL_INTERVAL: {{ .Values.config.pollInterval | quote }}
  HTTP_ADDR: {{ .Values.config.httpAddr | quote }}
  WATCHED_CONTRACTS: {{ .Values.config.watchedContracts | quote }}
  START_LEDGER: {{ .Values.config.startLedger | quote }}
  RETENTION_LEDGERS: {{ .Values.config.retentionLedgers | quote }}
  PARTITION_LEDGER_SPAN: {{ .Values.config.partitionLedgerSpan | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  {{- if .Values.config.corsAllowedOrigins }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  {{- end }}
  {{- if .Values.config.rateLimitRps }}
  RATE_LIMIT_RPS: {{ .Values.config.rateLimitRps | quote }}
  {{- end }}
  {{- if .Values.config.rateLimitBurst }}
  RATE_LIMIT_BURST: {{ .Values.config.rateLimitBurst | quote }}
  {{- end }}
  {{- if .Values.config.rateLimitTrustedProxy }}
  RATE_LIMIT_TRUSTED_PROXY: {{ .Values.config.rateLimitTrustedProxy | quote }}
  {{- end }}
  {{- if .Values.config.enableMetrics }}
  ENABLE_METRICS: {{ .Values.config.enableMetrics | quote }}
  {{- end }}
  {{- if .Values.mtls.enabled }}
  MTLS_ENABLED: "true"
  TLS_CERT_FILE: "{{ .Values.mtls.mountPath | default "/etc/sorotrail/tls" }}/tls.crt"
  TLS_KEY_FILE: "{{ .Values.mtls.mountPath | default "/etc/sorotrail/tls" }}/tls.key"
  {{- if .Values.mtls.clientCASecretName }}
  TLS_CLIENT_CA_FILE: "{{ .Values.mtls.mountPath | default "/etc/sorotrail/tls" }}-client-ca/ca.crt"
  {{- else }}
  TLS_CLIENT_CA_FILE: "{{ .Values.mtls.mountPath | default "/etc/sorotrail/tls" }}/ca.crt"
  {{- end }}
  {{- end }}
  {{- if .Values.mtls.allowedIdentities }}
  TLS_CLIENT_ALLOWED_IDENTITIES: {{ .Values.mtls.allowedIdentities | quote }}
  {{- end }}
  {{- if .Values.mtls.tenantMap }}
  TLS_CLIENT_TENANT_MAP: {{ .Values.mtls.tenantMap | quote }}
  {{- end }}
  {{- if .Values.mtls.dbSecretName }}
  DB_TLS_CERT_FILE: "/etc/sorotrail/db-tls/tls.crt"
  DB_TLS_KEY_FILE: "/etc/sorotrail/db-tls/tls.key"
  DB_TLS_CA_FILE: "/etc/sorotrail/db-tls/ca.crt"
  {{- end }}
  {{- if .Values.mtls.archiveSecretName }}
  ARCHIVE_TLS_CERT_FILE: "/etc/sorotrail/archive-tls/tls.crt"
  ARCHIVE_TLS_KEY_FILE: "/etc/sorotrail/archive-tls/tls.key"
  ARCHIVE_TLS_CA_FILE: "/etc/sorotrail/archive-tls/ca.crt"
  {{- end }}
