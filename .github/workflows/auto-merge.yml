name: Auto-merge

# Merges pull requests that are genuinely ready: labelled, conflict-free,
# with every required check passed, and up to date with main. A branch that
# is behind is updated first and merged on a later run, once CI has re-run
# against the updated code.
#
# Identity: this runs as automation and is attributed as such. Use a GitHub
# App installation token or a machine account's PAT — not a human maintainer's
# personal token. Automating from a personal account is what gets accounts
# flagged; an App or Actions identity is the supported way to do this.
#
# TOKEN: the default GITHUB_TOKEN is deliberately not used. Pushes made with
# it do not trigger workflow runs, so a branch this bot updated would sit
# forever with stale checks and never become mergeable. AUTOMERGE_TOKEN must
# be an App installation token or a PAT with `repo` scope.

on:
  # Fires when the CI workflow finishes, which is the moment a pull request
  # most often becomes mergeable.
  #
  # This deliberately does NOT use check_suite. GitHub does not start a
  # workflow from an event generated by GITHUB_TOKEN, and CI runs under that
  # token, so its check suites can never trigger this - the repository logged
  # zero check_suite-triggered runs while that was the configured trigger.
  # workflow_run is the supported way to chain off another workflow and does
  # fire for Actions-generated runs.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # A fallback sweep. Do not rely on it as the primary trigger: GitHub delays
  # and drops scheduled runs under load, and on this repository a */15
  # schedule produced one run in five and a half hours.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "Single PR number to evaluate (blank = all open PRs)"
        required: false
        type: string
      dry_run:
        description: "Evaluate and log decisions without merging or commenting"
        required: false
        type: boolean
        default: true

# One run at a time: two concurrent sweeps could both decide to merge, and the
# loser would then be operating on a stale view of main.
concurrency:
  group: auto-merge
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify the token is present
        env:
          AUTOMERGE_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
        run: |
          if [ -z "$AUTOMERGE_TOKEN" ]; then
            echo "::error::AUTOMERGE_TOKEN is not set."
            echo "The default GITHUB_TOKEN cannot be used here: pushes made with it"
            echo "do not trigger workflow runs, so an updated branch would never get"
            echo "fresh checks and would never become mergeable."
            echo "Set AUTOMERGE_TOKEN to a GitHub App installation token or a machine"
            echo "account PAT with 'repo' scope."
            exit 1
          fi

      - name: Evaluate and merge
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_BRANCH: main

          # --- policy knobs -------------------------------------------------
          # Merge any pull request meeting the criteria, with no opt-in label.
          # This is a deliberate maintainer decision.
          #
          # In practice: every pull request that compiles, passes the required
          # checks, has no conflict and is up to date is merged into main
          # without a human reading it. Every open pull request here comes from
          # a fork, so that includes contributors with no prior relationship to
          # the project.
          #
          # A green CI run means the code builds and the tests pass. It does not
          # mean the change is safe - nothing here inspects what the code does.
          # Changes touching the tenant boundary (store.Scope), credential
          # handling, workflow files, or dependencies deserve a human eye.
          #
          # To narrow this later without going back to labels for everyone, set
          # TRUSTED_AUTHORS and flip this to "true": listed authors merge
          # automatically, everyone else needs the label.
          REQUIRE_LABEL: "false"
          AUTOMERGE_LABEL: automerge

          # Authors who may merge without the label. Leave empty to require it
          # from everyone.
          TRUSTED_AUTHORS: ""

          MERGE_METHOD: merge
          ONLY_PR: ${{ github.event.inputs.pr }}
          # Scheduled and check_suite runs act for real; a manual run defaults
          # to dry-run so you can see what it would do before letting it.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
        run: python .github/scripts/auto_merge.py
